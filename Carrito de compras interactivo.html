
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrito de compras</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

  <style>
    body {
      background-color: #f5f5f5;
    }

    .producto-img {
      height: 180px;
      object-fit: cover;
    }

    .card {
      transition: 0.3s;
    }

    .card:hover {
      transform: translateY(-4px);
    }

    .agregado {
      background-color: #198754;
      color: white;
    }

    .eliminado {
      background-color: #dc3545;
      color: white;
    }
  </style>
</head>

<body>

  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <span class="navbar-brand">Mi Tienda</span>
      <span class="badge bg-success fs-6">
        Carrito: <span id="contador">0</span>
      </span>
    </div>
  </nav>

  <main class="container my-4">
    <h1 class="text-center mb-4">Nuestros productos</h1>

    <div class="row g-4" id="catalogo"></div>

    <section class="card shadow mt-5 mb-5">
      <div class="card-header bg-dark text-white">
        <h2 class="h4 mb-0">Mi carrito de compras</h2>
      </div>

      <div class="card-body">
        <ul id="lista-carrito" class="list-group mb-3">
          <li class="list-group-item text-muted">
            Tu carrito está vacío.
          </li>
        </ul>

        <div class="d-flex justify-content-between align-items-center">
          <h3 class="h5">Total:</h3>
          <h3 class="h4 text-success" id="total">$0.00</h3>
        </div>

        <button id="vaciar" class="btn btn-danger mt-3">
          Vaciar carrito
        </button>
      </div>
    </section>
  </main>

  <script>
    // 1. Lista de productos
    const productos = [
      {
        id: 1,
        nombre: "Audífonos",
        precio: 350,
        imagen: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500"
      },
      {
        id: 2,
        nombre: "Reloj",
        precio: 600,
        imagen: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500"
      },
      {
        id: 3,
        nombre: "Mochila",
        precio: 450,
        imagen: "https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=500"
      },
      {
        id: 4,
        nombre: "Cámara",
        precio: 1200,
        imagen: "https://images.unsplash.com/photo-1516035069371-29a1b244cc32?w=500"
      },
      {
        id: 5,
        nombre: "Tenis",
        precio: 900,
        imagen: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500"
      }
    ];

    // 2. El carrito guarda los productos y sus cantidades
    const carrito = {};

    const catalogo = document.getElementById("catalogo");
    const listaCarrito = document.getElementById("lista-carrito");
    const contador = document.getElementById("contador");
    const total = document.getElementById("total");

    // 3. Mostrar las cinco tarjetas
    productos.forEach(producto => {
      catalogo.innerHTML += `
        <div class="col-12 col-sm-6 col-lg-4 col-xl">
          <div class="card h-100 shadow-sm">
            <img src="${producto.imagen}"
                 class="card-img-top producto-img"
                 alt="${producto.nombre}">

            <div class="card-body d-flex flex-column">
              <h5 class="card-title">${producto.nombre}</h5>
              <p class="card-text">
                $${producto.precio.toLocaleString("es-MX")}.00
              </p>

              <button
                id="btn-${producto.id}"
                class="btn btn-primary mt-auto"
                onclick="agregar(${producto.id})">
                Agregar
              </button>
            </div>
          </div>
        </div>
      `;
    });

    // 4. Agregar productos al carrito
    function agregar(id) {
      if (!carrito[id]) {
        carrito[id] = 0;
      }

      carrito[id]++;

      const boton = document.getElementById(`btn-${id}`);
      boton.classList.remove("btn-primary");
      boton.classList.add("agregado");
      boton.textContent = `Agregado (${carrito[id]})`;

      actualizarCarrito();
    }

    // 5. Eliminar una unidad del producto
    function eliminar(id) {
      carrito[id]--;

      if (carrito[id] === 0) {
        delete carrito[id];

        const boton = document.getElementById(`btn-${id}`);
        boton.classList.remove("agregado");
        boton.classList.add("eliminado");
        boton.textContent = "Eliminado";

        // Regresar el botón a su estado original
        setTimeout(() => {
          if (!carrito[id]) {
            boton.classList.remove("eliminado");
            boton.classList.add("btn-primary");
            boton.textContent = "Agregar";
          }
        }, 900);
      } else {
        const boton = document.getElementById(`btn-${id}`);
        boton.textContent = `Agregado (${carrito[id]})`;
      }

      actualizarCarrito();
    }

    // 6. Actualizar productos, contador y total
    function actualizarCarrito() {
      listaCarrito.innerHTML = "";
      let cantidadTotal = 0;
      let precioTotal = 0;
      let hayProductos = false;

      productos.forEach(producto => {
        const cantidad = carrito[producto.id] || 0;

        if (cantidad > 0) {
          hayProductos = true;
          cantidadTotal += cantidad;
          precioTotal += producto.precio * cantidad;

          listaCarrito.innerHTML += `
            <li class="list-group-item d-flex
                       justify-content-between align-items-center gap-2">
              <div>
                <strong>${producto.nombre}</strong>
                <br>
                ${cantidad} × $${producto.precio.toLocaleString("es-MX")}.00
              </div>

              <button class="btn btn-danger btn-sm"
                      onclick="eliminar(${producto.id})">
                Eliminar
              </button>
            </li>
          `;
        }
      });

      if (!hayProductos) {
        listaCarrito.innerHTML = `
          <li class="list-group-item text-muted">
            Tu carrito está vacío.
          </li>
        `;
      }

      contador.textContent = cantidadTotal;
      total.textContent = precioTotal.toLocaleString("es-MX", {
        style: "currency",
        currency: "MXN"
      });
    }

    // 7. Vaciar todo el carrito
    document.getElementById("vaciar").addEventListener("click", () => {
      Object.keys(carrito).forEach(id => {
        delete carrito[id];

        const boton = document.getElementById(`btn-${id}`);
        boton.classList.remove("agregado");
        boton.classList.add("eliminado");
        boton.textContent = "Eliminado";

        setTimeout(() => {
          if (!carrito[id]) {
            boton.classList.remove("eliminado");
            boton.classList.add("btn-primary");
            boton.textContent = "Agregar";
          }
        }, 900);
      });

      actualizarCarrito();
    });
  </script>

</body>
</html>
