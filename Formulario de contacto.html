
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de contacto</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">

                <div class="card shadow p-4">
                    <h1 class="text-center mb-4">Formulario de contacto</h1>

                    <form>
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre:</label>
                            <input type="text" id="nombre" name="nombre"
                                   class="form-control" placeholder="Escribe tu nombre">
                        </div>

                        <div class="mb-3">
                            <label for="correo" class="form-label">Correo electrónico:</label>
                            <input type="email" id="correo" name="correo"
                                   class="form-control" placeholder="ejemplo@correo.com">
                        </div>

                        <div class="mb-3">
                            <label for="telefono" class="form-label">Teléfono:</label>
                            <input type="text" id="telefono" name="telefono"
                                   class="form-control" placeholder="Escribe tu teléfono">
                        </div>

                        <div class="mb-3">
                            <label for="mensaje" class="form-label">Mensaje:</label>
                            <textarea id="mensaje" name="mensaje"
                                      class="form-control" rows="4"
                                      placeholder="Escribe tu mensaje"></textarea>
                        </div>

                        <button type="submit" class="btn btn-primary">
                            Enviar
                        </button>

                        <button type="reset" class="btn btn-secondary">
                            Limpiar
                        </button>
                    </form>
                </div>

            </div>
        </div>
    </div>

    <script>
        // 1. Seleccionar el primer campo de texto y cambiar su fondo
        const primerCampo = document.querySelector('input[type="text"]');
        primerCampo.classList.add('bg-success');

        // 2. Seleccionar todos los botones y aplicar la clase btn-danger
        const botones = document.querySelectorAll('button');
        botones.forEach(function(boton) {
            boton.classList.add('btn-danger');
        });

        // 3. Seleccionar el campo de nombre y cambiar el color del texto
        const campoNombre = document.getElementsByName('nombre')[0];
        campoNombre.classList.add('text-warning');
    </script>

</body>
</html>
